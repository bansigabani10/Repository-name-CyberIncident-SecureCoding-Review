<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Report Incident</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Report Cyber Incident</h1>


    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('report') }}"
    >

        <!-- CSRF protection -->

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <label for="title">
            Incident Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            maxlength="200"
            required
        >


        <label for="description">
            Incident Description
        </label>

        <textarea
            id="description"
            name="description"
            maxlength="5000"
            rows="7"
            required
        ></textarea>


        <label for="severity">
            Severity
        </label>

        <select
            id="severity"
            name="severity"
            required
        >

            <option value="Low">
                Low
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="High">
                High
            </option>

            <option value="Critical">
                Critical
            </option>

        </select>


        <button type="submit">
            Submit Incident
        </button>

    </form>


    <p>

        <a href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

    </p>

</div>

</body>

</html>
