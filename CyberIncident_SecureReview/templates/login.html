<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CyberIncident</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>CyberIncident</h1>

    <h2>Login</h2>


    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >

        <!-- CSRF protection -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>
    </p>

</div>

</body>

</html>
